# UM980 + RTKLIB one-pass recommended basis
#
# Purpose:
#   Default one-pass post-processing profile for UM980 logs.
#   This file intentionally contains no run-specific PRN blacklist.
#
# Derived from the May 2026 debug runs:
#   - GPS + Galileo + BeiDou performed better than including GLONASS.
#   - Multi-frequency L1/L2/L5/L6 performed better than L1/L2-only.
#   - A stricter positioning elevation mask around 28 deg was safer than 15 deg.
#   - Hard-coded satellite exclusions are not suitable as a general default.
#
# RTKLIB-ex/demo5 post-processing profile for Unicore UM980 rover logs.
#
# Goal: maximize use of UM980 multi-constellation, multi-frequency observables
# for high-quality PPK/RTK post-processing. This is intentionally more
# aggressive than the generated fallback CLI options. It enables the full set of
# constellations for which the current pipeline can generate complete rover NAV
# sidecars: GPS, GLONASS, Galileo, and BeiDou. QZSS, SBAS, and NavIC observations
# are useful diagnostics, but should not be selected here until matching NAV/SBS
# products are available for RTKLIB input.
#
# If a data set fixes poorly, the first conservative diagnostic downgrade is:
#   pos1-frequency =l1+l2

pos1-posmode       =kinematic  # (0:single,1:dgps,2:kinematic,3:static,4:static-start,5:movingbase,6:fixed,7:ppp-kine,8:ppp-static,9:ppp-fixed)
pos1-frequency     =l1+l2+l5+l6 # (1:l1,2:l1+l2,3:l1+l2+l5,4:l1+l2+l5+l6)
pos1-soltype       =combined   # (0:forward,1:backward,2:combined,3:combined-nophasereset)
pos1-elmask         =28  # recommended one-pass mask from debug runs; avoids low-elevation multipath without PRN blacklist
pos1-snrmask_r     =on        # (0:off,1:on)
pos1-snrmask_b     =on        # (0:off,1:on)
pos1-snrmask_L1    =35,35,35,35,35,35,35,35,35
pos1-snrmask_L2    =35,35,35,35,35,35,35,35,35
pos1-snrmask_L5    =35,35,35,35,35,35,35,35,35
pos1-dynamics      =on         # (0:off,1:on)
pos1-tidecorr      =off        # (0:off,1:on,2:otl)
pos1-ionoopt       =brdc       # (0:off,1:brdc,2:sbas,3:dual-freq,4:est-stec,5:ionex-tec,6:qzs-brdc)
pos1-tropopt       =saas       # (0:off,1:saas,2:sbas,3:est-ztd,4:est-ztdgrad)
pos1-sateph        =brdc       # (0:brdc,1:precise,2:brdc+sbas,3:brdc+ssrapc,4:brdc+ssrcom)
pos1-posopt1       =off        # (0:off,1:on)
pos1-posopt2       =off        # (0:off,1:on)
pos1-posopt3       =off        # (0:off,1:on,2:precise)
pos1-posopt4       =off        # (0:off,1:on)
pos1-posopt5       =off        # (0:off,1:on)
pos1-posopt6       =off        # (0:off,1:on)
pos1-exclsats       =  # none by default; do not ship run-specific PRN exclusions
pos1-navsys         =41  # GPS + Galileo + BeiDou; GLONASS excluded

pos2-armode         =continuous  # avoid fix-and-hold poisoning while retaining AR attempts
pos2-gloarmode      =off  # GLONASS AR disabled/excluded by navsys
pos2-bdsarmode      =on  # BeiDou AR enabled
pos2-arfilter      =on         # (0:off,1:on)
pos2-arthres        =4  # conservative ambiguity validation threshold
pos2-arthresmin    =3
pos2-arthresmax    =6
pos2-arthres1      =0.1
pos2-arthres2      =0
pos2-arthres3      =1e-09
pos2-arthres4      =1e-05
pos2-varholdamb    =0.1        # (cyc^2)
pos2-gainholdamb   =0.01
pos2-arlockcnt      =15  # avoid freshly reset ambiguities
pos2-minfixsats    =6
pos2-minholdsats   =5
pos2-mindropsats   =10
pos2-arelmask       =35  # AR uses higher-elevation satellites only
pos2-arminfix      =30
pos2-armaxiter     =1
pos2-elmaskhold    =15         # (deg)
pos2-aroutcnt      =20
pos2-maxage        =30         # (s)
pos2-syncsol       =off        # (0:off,1:on)
pos2-slipthres     =0.05       # (m)
pos2-dopthres      =0          # (m)
pos2-rejionno       =2  # do not disable ionospheric residual rejection
pos2-rejcode        =10  # code residual rejection
pos2-niter         =2
pos2-baselen       =0          # (m)
pos2-basesig       =0          # (m)

out-solformat      =llh        # (0:llh,1:xyz,2:enu,3:nmea)
out-outhead        =on         # (0:off,1:on)
out-outopt         =on         # (0:off,1:on)
out-outvel         =off        # (0:off,1:on)
out-timesys        =gpst       # (0:gpst,1:utc,2:jst)
out-timeform       =hms        # (0:tow,1:hms)
out-timendec       =3
out-degform        =deg        # (0:deg,1:dms)
out-fieldsep       =
out-outsingle      =off        # (0:off,1:on)
out-maxsolstd      =0          # (m)
out-height         =ellipsoidal # (0:ellipsoidal,1:geodetic)
out-geoid          =internal   # (0:internal,1:egm96,2:egm08_2.5,3:egm08_1,4:gsi2000)
out-solstatic      =all        # (0:all,1:single)
out-nmeaintv1      =0          # (s)
out-nmeaintv2      =0          # (s)
out-outstat         =residual  # emit compact .stat residual diagnostics

stats-eratio1      =300
stats-eratio2      =300
stats-eratio5      =300
stats-errphase     =0.005      # (m)
stats-errphaseel   =0.005      # (m)
stats-errphasebl   =0          # (m/10km)
stats-errdoppler   =1          # (Hz)
stats-snrmax       =52         # (dB.Hz)
stats-errsnr       =0          # (m)
stats-errrcv       =0          # ( )
stats-stdbias      =30         # (m)
stats-stdiono      =0.03       # (m)
stats-stdtrop      =0.3        # (m)
stats-prnaccelh    =3          # (m/s^2)
stats-prnaccelv    =1          # (m/s^2)
stats-prnbias      =0.0001     # (m)
stats-prniono      =0.001      # (m)
stats-prntrop      =0.0001     # (m)
stats-prnpos       =0          # (m)
stats-clkstab      =5e-12      # (s/s)

ant1-postype       =single     # (0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm)
ant1-pos1          =0          # (deg|m)
ant1-pos2          =0          # (deg|m)
ant1-pos3          =0          # (m|m)
ant1-anttype       =
ant1-antdele       =0          # (m)
ant1-antdeln       =0          # (m)
ant1-antdelu       =0          # (m)
ant2-postype       =rinexhead  # (0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm)
ant2-pos1          =0          # (deg|m)
ant2-pos2          =0          # (deg|m)
ant2-pos3          =0          # (m|m)
ant2-anttype       =
ant2-antdele       =0          # (m)
ant2-antdeln       =0          # (m)
ant2-antdelu       =0          # (m)
ant2-maxaveep      =1
ant2-initrst       =on         # (0:off,1:on)

misc-timeinterp    =on         # (0:off,1:on)
misc-sbasatsel     =0          # (0:all)
misc-rnxopt1       =
misc-rnxopt2       =
misc-pppopt        =

file-satantfile    =
file-rcvantfile    =
file-staposfile    =
file-geoidfile     =
file-ionofile      =
file-dcbfile       =
file-eopfile       =
file-blqfile       =
file-tempdir       =
file-geexefile     =
file-solstatfile   =
file-tracefile      =  # no trace file by default
